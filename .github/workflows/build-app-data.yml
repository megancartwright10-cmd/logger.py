name: Build app data

on:
  schedule:
    - cron: "37 */2 * * *"   # every 2 hours, so today's waits fill in as the day goes
  workflow_dispatch:
  push:
    paths:
      - build_app_data.py
      - pqt_history.py
      - .github/workflows/build-app-data.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Bring back recent readings from Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archives
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^waits-' | sort | tail -3); do
            gh release download "$tag" -D archives -p '*.tar.gz' --clobber || echo "Could not download $tag"
          done
          python3 restore_waits.py archives

      # Park Queue Times history: kept in GitHub's private build cache, never committed
      # (this repo is public and their raw data can't be republished). Refreshed once a day.
      # newest saved copy comes back; every build saves a new one (GitHub drops old copies by itself)
      - name: Bring back Park Queue Times history
        uses: actions/cache/restore@v4
        with:
          path: pqt-cache
          key: pqt-${{ github.run_id }}
          restore-keys: pqt-

      - name: Fetch Park Queue Times history (once a day)
        env:
          PQT_KEY: ${{ secrets.PQT_KEY }}
        run: python3 pqt_history.py

      - name: Keep Park Queue Times history for later builds
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: pqt-cache
          key: pqt-${{ github.run_id }}

      - name: Build app data
        run: python3 build_app_data.py

      - name: Save to repo
        run: |
          git config user.name "wait-logger"
          git config user.email "wait-logger@users.noreply.github.com"
          git add data/app
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "App data $(date -u +%Y-%m-%d)"
          # the restored readings are only for building; set them aside so they're never committed
          git checkout -- data
          git clean -fdq -- data archives pqt-cache
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
