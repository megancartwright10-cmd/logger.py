name: Log wait times

# GitHub often delays or skips very frequent schedules, so instead of a new job
# every 5 minutes, one job starts each hour and takes a reading every 5 minutes
# itself. If an hourly start is missed, the next one picks up.
on:
  schedule:
    - cron: "7 * * * *"      # hourly, a few minutes past to avoid the busy top of the hour
  workflow_dispatch:         # "Run workflow" button to start it by hand

permissions:
  contents: write

concurrency:
  group: log-waits
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4

      # Readings are no longer saved into the repository (it would grow by about
      # 1 GB a year). Each hour's readings go into a small .tar.gz on a GitHub
      # Release called waits-YYYY-MM instead; Releases don't count towards the
      # repository's size. restore_waits.py puts them back when they're needed.
      - name: Log every 5 minutes for about an hour
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf data/20??-??          # start empty, so this hour's file holds only this hour
          month=$(date -u +%Y-%m)
          tag="waits-$month"
          asset="waits-$(date -u +%Y-%m-%dT%H%M).tar.gz"
          save() {
            ls data/20??-??/*.csv >/dev/null 2>&1 || { echo "Nothing to save yet (parks probably closed)"; return 0; }
            tar czf "$asset" data/20??-??/*.csv
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --latest=false \
              --title "Wait times $month" --notes "Ride wait readings, one file per hour. Merge them with restore_waits.py." \
              || true
            for i in 1 2 3; do
              gh release upload "$tag" "$asset" --clobber && { echo "Saved $asset"; return 0; }
              sleep 10
            done
            echo "Could not upload $asset"
          }
          end=$(( $(date +%s) + 57*60 ))
          n=0
          while :; do
            started=$(date +%s)
            python3 logger.py || echo "Logger reported a problem (see above)"
            n=$(( n + 1 ))
            [ $(( n % 3 )) -eq 0 ] && save    # every 15 minutes, so a crash loses little
            next=$(( started + 300 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - $(date +%s) > 0 ? next - $(date +%s) : 0 ))
          done
          save
