name: One-off Killer Klowns check
on:
  push:
    paths: [tools/kk_check.py, .github/workflows/kk-check.yml]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: pqt-cache
          key: pqt-none
          restore-keys: pqt-
      - run: python3 tools/kk_check.py
