name: Log wait times

# GitHub often delays or skips very frequent schedules, so instead of a new job
# every 5 minutes, one job starts each hour and takes a reading every 5 minutes
# itself. If an hourly start is missed, the next one picks up.
on:
  schedule:
    - cron: "7 * * * *"      # hourly, a few minutes past to avoid the busy top of the hour
  workflow_dispatch:         # "Run workflow" button to start it by hand

permissions:
  contents: write

concurrency:
  group: log-waits
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4

      - name: Log every 5 minutes for about an hour
        run: |
          git config user.name "wait-logger"
          git config user.email "wait-logger@users.noreply.github.com"
          end=$(( $(date +%s) + 57*60 ))
          while :; do
            started=$(date +%s)
            python3 logger.py || echo "Logger reported a problem (see above)"
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "Wait times $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do
                git pull -q --rebase && git push -q && break
                sleep 5
              done
            else
              echo "Nothing new (parks probably closed)"
            fi
            next=$(( started + 300 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - $(date +%s) > 0 ? next - $(date +%s) : 0 ))
          done
