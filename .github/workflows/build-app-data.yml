name: Build app data

on:
  schedule:
    - cron: "37 */2 * * *"   # every 2 hours, so today's waits fill in as the day goes
  workflow_dispatch:
  push:
    paths:
      - build_app_data.py
      - .github/workflows/build-app-data.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Bring back recent readings from Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archives
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^waits-' | sort | tail -3); do
            gh release download "$tag" -D archives -p '*.tar.gz' --clobber || echo "Could not download $tag"
          done
          python3 restore_waits.py archives

      - name: Build app data
        run: python3 build_app_data.py

      - name: Save to repo
        run: |
          git config user.name "wait-logger"
          git config user.email "wait-logger@users.noreply.github.com"
          git add data/app
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "App data $(date -u +%Y-%m-%d)"
          # the restored readings are only for building; set them aside so they're never committed
          git checkout -- data
          git clean -fdq -- data archives
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
